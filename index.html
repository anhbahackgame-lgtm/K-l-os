<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMAYBEOHUB - GATEWAY v6.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121216;
            --bg-card: #19191e;
            --bg-surface: #23232a;
            --border-glow: #8b5cf6;
            --neon-cyan: #00f2fe;
            --neon-white: #ffffff;
            --neon-yellow: #fbbf24;
            --neon-red: #f43f5e;
            --text-primary: #dcdcfe;
            --text-secondary: #8c8c96;
            --btn-getkey: #10b981;
            --btn-copy: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            color: var(--text-primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* KHUNG CONTAINER NEON v6.1 */
        .container { 
            background: var(--bg-card); 
            padding: 40px 30px; 
            border-radius: 20px; 
            text-align: center; 
            width: 100%;
            max-width: 420px; 
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #28282d;
            z-index: 5;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* VIỀN NEON XOAY */
        .container::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 23px;
            background: linear-gradient(45deg, var(--neon-white), var(--border-glow), var(--neon-cyan), var(--border-glow));
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.4;
            animation: neonGlow 4s linear infinite;
        }

        @keyframes neonGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes popup {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .icon-box {
            width: 56px; height: 56px;
            background: var(--bg-surface);
            border-radius: 14px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .icon-box svg {
            width: 28px; height: 28px;
            fill: var(--neon-white);
        }

        h1 { 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--neon-white); 
            margin-bottom: 6px; 
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        /* THÔNG BÁO XÓA KEY */
        .notice-banner {
            background: rgba(251, 191, 36, 0.08);
            border: 1px dashed rgba(251, 191, 36, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .notice-icon { font-size: 18px; }

        .notice-text {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--neon-yellow);
            line-height: 1.4;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            background: var(--bg-surface); 
            border: 1px solid var(--border-glow); 
            border-radius: 12px; 
            color: var(--neon-cyan); 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 13px; 
            text-align: center; 
            outline: none; 
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        input.error-text {
            color: var(--neon-red) !important;
            border-color: rgba(244, 63, 94, 0.5);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
        }

        input.vip-text {
            color: var(--neon-yellow) !important;
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button { 
            flex: 1;
            padding: 15px 10px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 13px; 
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.btn-copy {
            background: var(--btn-copy);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.btn-copy:hover:not(:disabled) { 
            background: #7c3aed;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
            transform: translateY(-2px);
        }

        button.btn-getkey {
            background: var(--btn-getkey);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        button.btn-getkey:hover:not(:disabled) {
            background: #059669;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            transform: translateY(-2px);
        }

        /* NÚT VIP 4 LINK — VÀNG GIỐNG SCRIPT */
        button.btn-vip {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #111111;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }

        button.btn-vip:hover:not(:disabled) {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.8);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #2a2a32 !important;
            color: #64748b !important;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .toast {
            background: #19191e;
            border: 1px solid var(--border-glow);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--neon-cyan);
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
    </div>

    <h1 id="mainTitle">MEMAYBEO HUB v6.2</h1>
    <div class="subtitle" id="subTitle">Cổng tạo &amp; xác thực Key tự động</div>
    
    <div class="notice-banner">
        <span class="notice-icon">⚠️</span>
        <span class="notice-text">KEY VIP: vượt đủ 4 liên kết (2 Link4M + 2 Gtraffic) — KEY THƯỜNG: 1 Gtraffic + 1 Link4M. Mọi Key tự ĐẶT HẠN sau 6 giờ!</span>
    </div>

    <div class="input-wrapper">
        <input type="text" id="keyInput" readonly value="BẤM 'LẤY KEY' ĐỂ VƯỢT LINK">
    </div>
    
    <div class="btn-group">
        <button id="mainBtn" class="btn-copy" onclick="copyToClipboard()">SAO CHÉP KEY</button>
        <button id="getKeyBtn" class="btn-getkey" onclick="generateNewKeyLink()">KEY THƯỜNG (2 LINK)</button>
    </div>
    <button id="vipBtn" class="btn-vip" onclick="generateVipKeyLink()">★ KEY VIP — VƯỢT 4 LINK ★</button>
</div>

<div class="toast-container">
    <div id="toast" class="toast"></div>
</div>

<script>
    const BASE_FIREBASE = "https://keyvip-eeae4-default-rtdb.firebaseio.com/";
    const LINK4M_TOKEN  = "68f64fc13101924671364239";
    const GTRAFFIC_KEY  = "c07db1e0af4649ffadc5d6db0d43edb6";
    const MY_WEB_URL    = "https://anhbahackgame-lgtm.github.io/K-l-os/";

    let isCreating = false;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.borderColor = isError ? "var(--neon-red)" : "var(--border-glow)";
        toast.style.color = isError ? "var(--neon-red)" : "var(--neon-cyan)";
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function generateRandomID(prefix, length) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let str = prefix + "_";
        for (let i = 0; i < length; i++) {
            str += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return str;
    }

    async function fbPatch(path, data) {
        const res = await fetch(`${BASE_FIREBASE}${path}.json`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error("Firebase lỗi: " + res.status);
    }

    function fbDelete(path) {
        fetch(`${BASE_FIREBASE}${path}.json`, { method: 'DELETE' }).catch(() => {});
    }

    // =========================================================
    // BỘ RÚT GỌN LINK ĐA DỊCH VỤ (LINK4M + GTRAFFIC)
    // Quét sâu JSON chống lỗi format + fallback tự động
    // =========================================================
    function findShortLink(obj, originalUrl, depth = 0) {
        if (typeof obj === "string") {
            return (obj.startsWith("http") && obj !== originalUrl) ? obj : null;
        }
        if (typeof obj !== "object" || obj === null || depth > 6) return null;
        const priority = ["shortenedUrl", "shortlink", "shortLink", "shortUrl", "short_url", "shortened", "url", "link", "result"];
        for (const key of priority) {
            if (obj[key] !== undefined) {
                const found = findShortLink(obj[key], originalUrl, depth + 1);
                if (found) return found;
            }
        }
        for (const key in obj) {
            const found = findShortLink(obj[key], originalUrl, depth + 1);
            if (found) return found;
        }
        return null;
    }

    async function shortenViaGtraffic(targetUrl) {
        const api = `https://manager.gtraffic.io/api/cong-khai/tao-lien-ket?apikey=${GTRAFFIC_KEY}&url=${encodeURIComponent(targetUrl)}`;
        for (let attempt = 0; attempt < 2; attempt++) {
            try {
                const res = await fetch(api);
                const text = (await res.text()).trim();
                if (text.startsWith("http")) return text;
                let data = null;
                try { data = JSON.parse(text); } catch (e) {}
                const found = findShortLink(data, targetUrl);
                if (found) return found;
            } catch (e) {}
            await new Promise(r => setTimeout(r, 500));
        }
        // FALLBACK: định dạng trực tiếp gtraffic.io/st (luôn hoạt động)
        showToast("API GTRAFFIC CHẬM — DÙNG ĐỊNH DẠNG TRỰC TIẾP", true);
        return `https://gtraffic.io/st?apikey=${GTRAFFIC_KEY}&url=${encodeURIComponent(targetUrl)}`;
    }

    async function shortenViaLink4m(targetUrl) {
        try {
            const res = await fetch(`https://link4m.co/api-shorten?api=${LINK4M_TOKEN}&url=${encodeURIComponent(targetUrl)}`);
            const json = await res.json();
            if (json && (json.shortenedUrl || json.url)) return json.shortenedUrl || json.url;
        } catch (e) {}
        return `https://link4m.co/st?api=${LINK4M_TOKEN}&url=${encodeURIComponent(targetUrl)}`;
    }

    // service: "link4m" | "gtraffic" — mỗi dịch vụ tự có fallback riêng, chuỗi không bao giờ đứt
    async function shortenLink(targetUrl, service) {
        if (service === "gtraffic") {
            return await shortenViaGtraffic(targetUrl);
        }
        return await shortenViaLink4m(targetUrl);
    }

    // =========================================================
    // NÚT "KEY THƯỜNG": CHUỖI 2 TẦNG (1 GTRAFFIC + 1 LINK4M) — GIỐNG SCRIPT
    // =========================================================
    async function generateNewKeyLink() {
        if (isCreating) return;
        isCreating = true;

        const getKeyBtn = document.getElementById('getKeyBtn');
        const vipBtn = document.getElementById('vipBtn');
        const keyInput = document.getElementById('keyInput');
        getKeyBtn.disabled = true; vipBtn.disabled = true;
        getKeyBtn.innerText = "ĐANG TẠO...";
        showToast("Đang kết nối Server tạo chuỗi Link 2 tầng (Gtraffic + Link4M)...");

        try {
            const newKey = generateRandomID("MATRIX", 8);
            const pureSuffix = newKey.substring(7);
            const nowMs = Date.now();

            // 1. Lưu Key vào Firebase (6 tiếng = 360 phút)
            await fbPatch(newKey, {
                timeLeft: 360,
                initialTime: 360,
                status: "active",
                hwid: "",
                maxDevices: 1,
                tier: "normal",
                note: "Get Key Gtraffic+Link4M (Web)",
                createdAt: nowMs
            });

            // 2. ID_END — tầng đích cuối (tự xóa sau 15 phút như script)
            const idEnd = "ID_END_" + pureSuffix;
            await fbPatch(idEnd, { mapsTo: newKey, timeLeft: 15, createdAt: nowMs });
            setTimeout(() => fbDelete(idEnd), 900000);

            const finalTargetUrl = MY_WEB_URL + "?id=" + idEnd;

            // 3. Link4M Lớp 2
            const layer2Short = await shortenViaLink4m(finalTargetUrl);
            // 4. ID_MID — tầng trung gian (tự xóa sau 10 phút như script)
            const idMid = "ID_MID_" + pureSuffix;
            await fbPatch(idMid, { redirectTo: layer2Short, timeLeft: 10, createdAt: nowMs });
            setTimeout(() => fbDelete(idMid), 600000);

            const midTargetUrl = MY_WEB_URL + "?next=" + idMid;

            // 5. Gtraffic Lớp 1 (link đầu tiên người dùng vượt)
            const finalShortLink = await shortenViaGtraffic(midTargetUrl);

            keyInput.value = finalShortLink;
            showToast("TẠO LINK 2 LỚP (GTRAFFIC + LINK4M) THÀNH CÔNG! ĐANG CHUYỂN HƯỚNG...");
            setTimeout(() => { window.location.href = finalShortLink; }, 1000);

        } catch (error) {
            showToast("LỖI TẠO LINK: " + error.message, true);
        } finally {
            isCreating = false;
            getKeyBtn.innerText = "KEY THƯỜNG (2 LINK)";
            getKeyBtn.disabled = false; vipBtn.disabled = false;
        }
    }

    // =========================================================
    // NÚT "KEY VIP": CHUỖI 4 TẦNG (2 LINK4M + 2 GTRAFFIC) — Y HỆT SCRIPT
    // Lớp 1 (Link4M) -> Lớp 2 (Link4M) -> Lớp 3 (Gtraffic) -> Lớp 4 (Gtraffic) -> KEY VIP 6H
    // =========================================================
    async function generateVipKeyLink() {
        if (isCreating) return;
        isCreating = true;

        const getKeyBtn = document.getElementById('getKeyBtn');
        const vipBtn = document.getElementById('vipBtn');
        const keyInput = document.getElementById('keyInput');
        getKeyBtn.disabled = true; vipBtn.disabled = true;
        vipBtn.innerText = "ĐANG TẠO CHUỖI 4 LỚP...";
        showToast("Đang thiết lập chuỗi VIP 4 LỚP (2 Link4M + 2 Gtraffic)...");

        try {
            const newKey = generateRandomID("VIPMATRIX", 8);
            const pureSuffix = newKey.substring(10);
            const nowMs = Date.now();

            // Lưu Key VIP 6 tiếng vào Firebase
            await fbPatch(newKey, {
                timeLeft: 360,
                initialTime: 360,
                status: "active",
                hwid: "",
                maxDevices: 1,
                tier: "VIP",
                note: "Get Key VIP 4 Link (Web)",
                createdAt: nowMs
            });

            // ----- LỚP 4 (CUỐI CÙNG RA KEY) — GTRAFFIC -----
            showToast("Đang tạo LỚP 4/4 (Gtraffic)...");
            const idVip4 = "ID_VIP4_" + pureSuffix;
            await fbPatch(idVip4, { mapsTo: newKey, timeLeft: 20, createdAt: nowMs });
            setTimeout(() => fbDelete(idVip4), 1200000);
            const urlL4 = MY_WEB_URL + "?id=" + idVip4;
            const short4 = await shortenLink(urlL4, "gtraffic");

            // ----- LỚP 3 — GTRAFFIC -----
            showToast("Đang tạo LỚP 3/4 (Gtraffic)...");
            const idVip3 = "ID_VIP3_" + pureSuffix;
            await fbPatch(idVip3, { redirectTo: short4, timeLeft: 15, createdAt: nowMs });
            setTimeout(() => fbDelete(idVip3), 900000);
            const urlL3 = MY_WEB_URL + "?next=" + idVip3;
            const short3 = await shortenLink(urlL3, "gtraffic");

            // ----- LỚP 2 — LINK4M -----
            showToast("Đang tạo LỚP 2/4 (Link4M)...");
            const idVip2 = "ID_VIP2_" + pureSuffix;
            await fbPatch(idVip2, { redirectTo: short3, timeLeft: 10, createdAt: nowMs });
            setTimeout(() => fbDelete(idVip2), 600000);
            const urlL2 = MY_WEB_URL + "?next=" + idVip2;
            const short2 = await shortenLink(urlL2, "link4m");

            // ----- LỚP 1 (ĐẦU TIÊN) — LINK4M -----
            showToast("Đang tạo LỚP 1/4 (Link4M)...");
            const idVip1 = "ID_VIP1_" + pureSuffix;
            await fbPatch(idVip1, { redirectTo: short2, timeLeft: 5, createdAt: nowMs });
            setTimeout(() => fbDelete(idVip1), 300000);
            const urlL1 = MY_WEB_URL + "?next=" + idVip1;
            const finalShortLink = await shortenLink(urlL1, "link4m");

            keyInput.value = finalShortLink;
            keyInput.classList.add('vip-text');
            showToast("TẠO LINK VIP 4 LỚP THÀNH CÔNG! ĐANG CHUYỂN HƯỚNG...");
            setTimeout(() => { window.location.href = finalShortLink; }, 1000);

        } catch (error) {
            showToast("LỖI TẠO LINK VIP: " + error.message, true);
        } finally {
            isCreating = false;
            vipBtn.innerText = "★ KEY VIP — VƯỢT 4 LINK ★";
            getKeyBtn.disabled = false; vipBtn.disabled = false;
        }
    }

    // =========================================================
    // TỰ ĐỘNG XỬ LÝ URL TRẢ VỀ — NHẬN DIỆN LỚP THEO TIỀN TỐ ID
    // ID_MID_/ID_END_ = thường 2 lớp | ID_VIP1_..ID_VIP4_ = VIP 4 lớp
    // =========================================================
    function parseLayerInfo(id) {
        if (!id) return null;
        const map = {
            "ID_VIP1_": { cur: 1, total: 4, vip: true },
            "ID_VIP2_": { cur: 2, total: 4, vip: true },
            "ID_VIP3_": { cur: 3, total: 4, vip: true },
            "ID_VIP4_": { cur: 4, total: 4, vip: true },
            "ID_MID_":  { cur: 1, total: 2, vip: false },
            "ID_END_":  { cur: 2, total: 2, vip: false }
        };
        for (const prefix in map) {
            if (id.startsWith(prefix)) return map[prefix];
        }
        return null;
    }

    async function resolveKey() {
        const urlParams = new URLSearchParams(window.location.search);

        const idNext = urlParams.get('next') || urlParams.get('NEXT');
        const anonymousID = urlParams.get('id') || urlParams.get('ID') || urlParams.get('key') || urlParams.get('KEY');

        const keyInput = document.getElementById('keyInput');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');

        // TRANG TẦNG TRUNG GIAN: VƯỢT XONG LỚP N -> CHUYỂN SANG LINK LỚP KẾ TIẾP
        if (idNext) {
            const info = parseLayerInfo(idNext);
            const cur = info ? info.cur : 1;
            const total = info ? info.total : 2;
            const vipTag = info && info.vip ? " (VIP)" : "";

            mainTitle.innerText = "LỚP " + cur + "/" + total + " HOÀN TẤT" + vipTag;
            subTitle.innerText = "Đang chuyển sang liên kết tiếp theo...";
            keyInput.value = "ĐANG TẢI LINK LỚP " + (cur + 1) + "/" + total + "...";

            try {
                const response = await fetch(`${BASE_FIREBASE}${idNext}.json`);
                const data = await response.json();

                if (data && data.redirectTo) {
                    showToast("VƯỢT LỚP " + cur + "/" + total + " THÀNH CÔNG! ĐANG SANG LỚP " + (cur + 1) + "...");
                    setTimeout(() => { window.location.href = data.redirectTo; }, 1500);
                } else {
                    keyInput.value = "LỖI: LIÊN KẾT LỚP " + cur + " ĐÃ HẾT HẠN";
                    keyInput.classList.add('error-text');
                    showToast("LIÊN KẾT ĐÃ QUÁ HẠN, VUI LÒNG LẤY KEY MỚI", true);
                }
            } catch (error) {
                keyInput.value = "LỖI KẾT NỐI SERVER";
                keyInput.classList.add('error-text');
            }
            return;
        }

        // TRANG ĐÍCH: VƯỢT LỚP CUỐI -> HIỂN THỊ MÃ KEY (PHÂN BIỆT VIP/THƯỜNG)
        if (anonymousID) {
            try {
                const response = await fetch(`${BASE_FIREBASE}${anonymousID}.json`);
                const data = await response.json();

                if (data) {
                    if (data.status && String(data.status).toLowerCase() !== "active") {
                        keyInput.value = "LỖI: KEY BỊ KHÓA / TẠM DỪNG";
                        keyInput.classList.add('error-text');
                        showToast("KEY ĐÃ BỊ KHÓA TỪ HỆ THỐNG!", true);
                        return;
                    }

                    const parsedKey = data.mapsTo || data.key || (typeof data === "string" ? data : null);
                    if (parsedKey) {
                        const isVip = parsedKey.startsWith("VIPMATRIX");
                        keyInput.value = parsedKey;
                        if (isVip) {
                            keyInput.classList.add('vip-text');
                            mainTitle.innerText = "XÁC THỰC HOÀN TẤT — KEY VIP 6H";
                            mainTitle.style.color = "var(--neon-yellow)";
                            subTitle.innerText = "Key VIP 4 lớp của bạn đã sẵn sàng!";
                        } else {
                            mainTitle.innerText = "XÁC THỰC HOÀN TẤT";
                            subTitle.innerText = "Mã Key của bạn đã sẵn sàng!";
                        }
                        showToast("XÁC THỰC THÀNH CÔNG! BẤM SAO CHÉP MÃ KEY.");
                        return;
                    }
                }

                keyInput.value = "LỖI: KEY KHÔNG TỒN TẠI HOẶC ĐÃ XÓA";
                keyInput.classList.add('error-text');
                showToast("KEY ĐÃ HẾT HẠN, BẤM 'LẤY KEY MỚI'", true);
            } catch (error) {
                keyInput.value = "LỖI TRUY VẤN DATABASE";
                keyInput.classList.add('error-text');
            }
            return;
        }
    }

    async function copyToClipboard() {
        const keyInput = document.getElementById('keyInput');
        if (keyInput.value && !keyInput.value.startsWith("LỖI") && !keyInput.value.startsWith("BẤM") && !keyInput.value.startsWith("ĐANG")) {
            try {
                await navigator.clipboard.writeText(keyInput.value);
                showToast("ĐÃ SAO CHÉP KEY! HÃY VÀO GAME ĐỂ KÍCH HOẠT.");
            } catch (err) {
                keyInput.select();
                document.execCommand('copy');
                showToast("ĐÃ SAO CHÉP MÃ KEY VÀO KHAY NHỚ.");
            }
        } else {
            showToast("BẤM 'LẤY KEY' ĐỂ VƯỢT LINK LẤY KEY!", true);
        }
    }

    window.onload = resolveKey;
</script>
</body>
</html>
