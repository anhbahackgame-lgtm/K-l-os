<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMAYBEOHUB - GATEWAY v6.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121216;
            --bg-card: #19191e;
            --bg-surface: #23232a;
            --border-glow: #8b5cf6;
            --neon-cyan: #00f2fe;
            --neon-white: #ffffff;
            --neon-yellow: #fbbf24;
            --neon-red: #f43f5e;
            --text-primary: #dcdcfe;
            --text-secondary: #8c8c96;
            --btn-getkey: #10b981;
            --btn-copy: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            color: var(--text-primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
        }

        /* KHUNG CONTAINER CONTAINER NEON v6.0 */
        .container { 
            background: var(--bg-card); 
            padding: 40px 30px; 
            border-radius: 20px; 
            text-align: center; 
            width: 100%;
            max-width: 420px; 
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #28282d;
            z-index: 5;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* VIỀN NEON XOAY */
        .container::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 23px;
            background: linear-gradient(45deg, var(--neon-white), var(--border-glow), var(--neon-cyan), var(--border-glow));
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.4;
            animation: neonGlow 4s linear infinite;
        }

        @keyframes neonGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes popup {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .icon-box {
            width: 56px; height: 56px;
            background: var(--bg-surface);
            border-radius: 14px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .icon-box svg {
            width: 28px; height: 28px;
            fill: var(--neon-white);
        }

        h1 { 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--neon-white); 
            margin-bottom: 6px; 
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        /* THÔNG BÁO XÓA KEY */
        .notice-banner {
            background: rgba(251, 191, 36, 0.08);
            border: 1px dashed rgba(251, 191, 36, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .notice-icon { font-size: 18px; }

        .notice-text {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--neon-yellow);
            line-height: 1.4;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            background: var(--bg-surface); 
            border: 1px solid var(--border-glow); 
            border-radius: 12px; 
            color: var(--neon-cyan); 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 13px; 
            text-align: center; 
            outline: none; 
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        input.error-text {
            color: var(--neon-red) !important;
            border-color: rgba(244, 63, 94, 0.5);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button { 
            flex: 1;
            padding: 15px 10px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 13px; 
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.btn-copy {
            background: var(--btn-copy);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.btn-copy:hover:not(:disabled) { 
            background: #7c3aed;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
            transform: translateY(-2px);
        }

        button.btn-getkey {
            background: var(--btn-getkey);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        button.btn-getkey:hover:not(:disabled) {
            background: #059669;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #2a2a32;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .toast {
            background: #19191e;
            border: 1px solid var(--border-glow);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--neon-cyan);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
    </div>

    <h1 id="mainTitle">MEMAYBEO HUB v6.0</h1>
    <div class="subtitle" id="subTitle">Cổng tạo & xác thực Key tự động</div>
    
    <div class="notice-banner">
        <span class="notice-icon">⚠️</span>
        <span class="notice-text">LƯU Ý: Tất cả mã Key sẽ tự động bị XÓA / HẾT HẠN sau 6 giờ. Vui lòng kích hoạt ngay!</span>
    </div>

    <div class="input-wrapper">
        <input type="text" id="keyInput" readonly value="BẤM 'LẤY KEY MỚI' ĐỂ VƯỢT LINK">
    </div>
    
    <div class="btn-group">
        <button id="mainBtn" class="btn-copy" onclick="copyToClipboard()">SAO CHÉP KEY</button>
        <button id="getKeyBtn" class="btn-getkey" onclick="generateNewKeyLink()">LẤY KEY MỚI</button>
    </div>
</div>

<div class="toast-container">
    <div id="toast" class="toast"></div>
</div>

<script>
    const BASE_FIREBASE = "https://keyvip-eeae4-default-rtdb.firebaseio.com/";
    const LINK4M_TOKEN  = "68f64fc13101924671364239";
    const MY_WEB_URL    = "https://anhbahackgame-lgtm.github.io/K-l-os/";

    let isCreating = false;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.borderColor = isError ? "var(--neon-red)" : "var(--border-glow)";
        toast.style.color = isError ? "var(--neon-red)" : "var(--neon-cyan)";
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function generateRandomID(prefix, length) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let str = prefix + "_";
        for (let i = 0; i < length; i++) {
            str += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return str;
    }

    // =========================================================
    // NÚT "LẤY KEY MỚI": TỰ ĐỘNG TẠO LINK RÚT GỌN VƯỢT KEY
    // =========================================================
    async function generateNewKeyLink() {
        if (isCreating) return;
        isCreating = true;

        const getKeyBtn = document.getElementById('getKeyBtn');
        const keyInput = document.getElementById('keyInput');
        
        getKeyBtn.innerText = "ĐANG TẠO LINK...";
        getKeyBtn.disabled = true;
        showToast("Đang kết nối Server để tạo chuỗi Link 2 tầng...");

        try {
            const newKey = generateRandomID("MATRIX", 8);
            const pureSuffix = newKey.substring(7);
            const nowMs = Date.now();

            // 1. Lưu Key vào Firebase (thời gian hiệu lực: 360 phút = 6 tiếng)
            await fetch(`${BASE_FIREBASE}${newKey}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    timeLeft: 360, // 6 tiếng = 360 phút
                    initialTime: 360,
                    status: "active",
                    hwid: "",
                    tier: "normal",
                    createdAt: nowMs
                })
            });

            // 2. Tạo ID_END cho tầng đích cuối
            const idEnd = "ID_END_" + pureSuffix;
            await fetch(`${BASE_FIREBASE}${idEnd}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mapsTo: newKey, timeLeft: 15, createdAt: nowMs })
            });

            const finalTargetUrl = MY_WEB_URL + "?id=" + idEnd;

            // 3. Tạo Link4M Lớp 2
            let layer2Short = `https://link4m.co/st?api=${LINK4M_TOKEN}&url=${encodeURIComponent(finalTargetUrl)}`;
            try {
                const res2 = await fetch(`https://link4m.co/api-shorten?api=${LINK4M_TOKEN}&url=${encodeURIComponent(finalTargetUrl)}`);
                const json2 = await res2.json();
                if (json2 && (json2.shortenedUrl || json2.url)) {
                    layer2Short = json2.shortenedUrl || json2.url;
                }
            } catch (e) {}

            // 4. Tạo ID_MID cho tầng trung gian
            const idMid = "ID_MID_" + pureSuffix;
            await fetch(`${BASE_FIREBASE}${idMid}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ redirectTo: layer2Short, timeLeft: 10, createdAt: nowMs })
            });

            const midTargetUrl = MY_WEB_URL + "?next=" + idMid;

            // 5. Tạo Link4M Lớp 1
            let finalShortLink = `https://link4m.co/st?api=${LINK4M_TOKEN}&url=${encodeURIComponent(midTargetUrl)}`;
            try {
                const res1 = await fetch(`https://link4m.co/api-shorten?api=${LINK4M_TOKEN}&url=${encodeURIComponent(midTargetUrl)}`);
                const json1 = await res1.json();
                if (json1 && (json1.shortenedUrl || json1.url)) {
                    finalShortLink = json1.shortenedUrl || json1.url;
                }
            } catch (e) {}

            // Hoàn tất: Hiển thị Link và mở sang tab mới cho người dùng
            keyInput.value = finalShortLink;
            showToast("TẠO LINK THÀNH CÔNG! ĐANG CHUYỂN HƯỚNG...");
            
            setTimeout(() => {
                window.location.href = finalShortLink;
            }, 1000);

        } catch (error) {
            showToast("LỖI TẠO LINK: " + error.message, true);
        } finally {
            isCreating = false;
            getKeyBtn.innerText = "LẤY KEY MỚI";
            getKeyBtn.disabled = false;
        }
    }

    // =========================================================
    // TỰ ĐỘNG XỬ LÝ URL TRẢ VỀ (TẦNG 1 HOẶC TẦNG 2)
    // =========================================================
    async function resolveKey() {
        const urlParams = new URLSearchParams(window.location.search);
        
        const idNext = urlParams.get('next') || urlParams.get('NEXT');
        const anonymousID = urlParams.get('id') || urlParams.get('ID') || urlParams.get('key') || urlParams.get('KEY');
        
        const keyInput = document.getElementById('keyInput');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');

        // TẦNG 1: VƯỢT LINK 1 XONG -> REDIRECT SANG LINK 2
        if (idNext) {
            mainTitle.innerText = "TẦNG 1 HOÀN TẤT";
            subTitle.innerText = "Đang kết nối liên kết tầng 2...";
            keyInput.value = "ĐANG TẢI LINK RÚT GỌN TẦNG 2...";

            try {
                const response = await fetch(`${BASE_FIREBASE}${idNext}.json`);
                const data = await response.json();
                
                if (data && data.redirectTo) {
                    showToast("XÁC THỰC TẦNG 1 THÀNH CÔNG! CHUYỂN HƯỚNG TẦNG 2...");
                    setTimeout(() => window.location.href = data.redirectTo, 1500);
                } else {
                    keyInput.value = "LỖI: MÃ TẦNG 1 ĐÃ HẾT HẠN";
                    keyInput.classList.add('error-text');
                    showToast("LINK ĐÃ QUÁ HẠN 10 PHÚT, VUI LÒNG BẤM LẤY KEY MỚI", true);
                }
            } catch (error) {
                keyInput.value = "LỖI KẾT NỐI SERVER";
                keyInput.classList.add('error-text');
            }
            return;
        }

        // TẦNG 2: VƯỢT LINK 2 XONG -> HIỂN THỊ MÃ KEY HOÀN CHỈNH
        if (anonymousID) {
            try {
                const response = await fetch(`${BASE_FIREBASE}${anonymousID}.json`);
                const data = await response.json();
                
                if (data) {
                    const parsedKey = data.mapsTo || data.key || (typeof data === "string" ? data : null);
                    if (parsedKey) {
                        keyInput.value = parsedKey;
                        mainTitle.innerText = "XÁC THỰC HOÀN TẤT";
                        subTitle.innerText = "Mã Key của bạn đã sẵn sàng!";
                        showToast("XÁC THỰC THÀNH CÔNG! BẤM SAO CHÉP MÃ KEY.");
                        return;
                    }
                }
                
                keyInput.value = "LỖI: KEY KHÔNG TỒN TẠI HOẶC ĐÃ XÓA";
                keyInput.classList.add('error-text');
                showToast("KEY ĐÃ HẾT HẠN, BẤM 'LẤY KEY MỚI'", true);
            } catch (error) { 
                keyInput.value = "LỖI TRUY VẤN DATABASE"; 
                keyInput.classList.add('error-text');
            }
            return;
        }
    }

    async function copyToClipboard() {
        const keyInput = document.getElementById('keyInput');
        if (keyInput.value && !keyInput.value.startsWith("LỖI") && !keyInput.value.startsWith("BẤM") && !keyInput.value.startsWith("ĐANG")) {
            try {
                await navigator.clipboard.writeText(keyInput.value);
                showToast("ĐÃ SAO CHÉP KEY! HÃY VÀO GAME ĐỂ KÍCH HOẠT.");
            } catch (err) {
                keyInput.select();
                document.execCommand('copy');
                showToast("ĐÃ SAO CHÉP MÃ KEY VÀO KHAY NHỚ.");
            }
        } else {
            showToast("BẤM 'LẤY KEY MỚI' ĐỂ VƯỢT LINK LẤY KEY!", true);
        }
    }

    window.onload = resolveKey;
</script>
</body>
</html>
